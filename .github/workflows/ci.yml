# ─────────────────────────────────────────────────────────────────────────────
#  CI/CD — Mymini-Project (tests E2E Playwright sur shop.missionplaywright.fr)
#
#  1. quality   : install, typecheck TypeScript, détection de test.only, liste des tests
#  2. plan      : choisit les navigateurs selon l'évènement (PR = chromium seul)
#  3. e2e       : un job par navigateur (matrix), rapports blob + allure en artefacts
#  4. report    : fusionne les rapports → HTML Playwright + Allure + résumé du run
#  5. deploy    : publie les rapports sur GitHub Pages (branche main uniquement)
# ─────────────────────────────────────────────────────────────────────────────
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Run de non-régression complet, du lundi au vendredi à 6h (heure de Paris, 5h UTC)
    - cron: "0 5 * * 1-5"
  workflow_dispatch:
    inputs:
      browsers:
        description: Navigateur(s) à tester
        type: choice
        options: [all, chromium, firefox, webkit]
        default: all
      include_commande:
        description: "Inclure les tests @commande (crée une VRAIE commande sur le compte de test)"
        type: boolean
        default: false

# Un seul run à la fois par branche : un nouveau push annule le run précédent
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CI: true
  FORCE_COLOR: 1

jobs:
  # ───────────────────────────── 1. Qualité ─────────────────────────────
  quality:
    name: Qualité du code
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Typecheck TypeScript
        run: npm run typecheck

      - name: Aucun test.only / describe.only oublié
        run: |
          if grep -rnE '\b(test|describe|it)\.only\(' tests/; then
            echo "::error::Un .only() a été laissé dans les tests"
            exit 1
          fi

      - name: Les tests sont bien collectés
        run: npx playwright test --list --project=chromium > /dev/null

  # ───────────────────────────── 2. Plan ─────────────────────────────
  plan:
    name: Choix des navigateurs
    runs-on: ubuntu-latest
    outputs:
      browsers: ${{ steps.set.outputs.browsers }}
      grep_args: ${{ steps.set.outputs.grep_args }}
    steps:
      - id: set
        env:
          EVENT: ${{ github.event_name }}
          INPUT_BROWSERS: ${{ inputs.browsers }}
          INCLUDE_COMMANDE: ${{ inputs.include_commande }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            browsers='["chromium"]'                          # retour rapide sur les PR
          elif [ "$EVENT" = "workflow_dispatch" ] && [ "$INPUT_BROWSERS" != "all" ]; then
            browsers="[\"$INPUT_BROWSERS\"]"
          else
            browsers='["chromium","firefox","webkit"]'
          fi

          if [ "$INCLUDE_COMMANDE" = "true" ]; then
            grep_args=""
          else
            grep_args="--grep-invert @commande"              # pas de vraie commande par défaut
          fi

          echo "browsers=$browsers" >> "$GITHUB_OUTPUT"
          echo "grep_args=$grep_args" >> "$GITHUB_OUTPUT"
          echo "Navigateurs : $browsers — filtre : ${grep_args:-aucun}"

  # ───────────────────────────── 3. Tests E2E ─────────────────────────────
  e2e:
    name: E2E (${{ matrix.browser }})
    needs: [quality, plan]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # Les navigateurs partagent les mêmes comptes de test (USER_EMAIL1/2) :
      # on les exécute l'un après l'autre pour éviter les conflits de panier / session.
      # Passez à 3 si chaque navigateur obtient son propre compte.
      max-parallel: 1
      matrix:
        browser: ${{ fromJSON(needs.plan.outputs.browsers) }}
    env:
      PW_BLOB_NAME: ${{ matrix.browser }}
      BASE_URL: ${{ vars.BASE_URL }}
      MMP_URL: ${{ vars.MMP_URL }}
      USER_EMAIL1: ${{ secrets.USER_EMAIL1 }}
      USER_PASSWORD1: ${{ secrets.USER_PASSWORD1 }}
      USER_EMAIL2: ${{ secrets.USER_EMAIL2 }}
      USER_PASSWORD2: ${{ secrets.USER_PASSWORD2 }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Vérification des secrets
        run: |
          if [ -z "$USER_EMAIL1" ] || [ -z "$USER_PASSWORD1" ]; then
            echo "::error::Secrets USER_EMAIL1 / USER_PASSWORD1 absents (Settings → Secrets and variables → Actions)"
            exit 1
          fi

      # Cache des navigateurs Playwright, invalidé à chaque changement de version
      - name: Version de Playwright
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache des navigateurs
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ steps.pw.outputs.version }}-${{ matrix.browser }}

      - name: Installation du navigateur
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Dépendances système uniquement (navigateur en cache)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps ${{ matrix.browser }}

      - name: Tests Playwright
        run: npx playwright test --project=${{ matrix.browser }} ${{ needs.plan.outputs.grep_args }}

      - name: Artefact — rapport blob
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: blob-report-${{ matrix.browser }}
          path: blob-report/
          retention-days: 3

      - name: Artefact — résultats Allure
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: allure-results-${{ matrix.browser }}
          path: allure-results/
          retention-days: 3

  # ───────────────────────────── 4. Rapports ─────────────────────────────
  report:
    name: Rapports
    needs: [e2e]
    if: ${{ !cancelled() && needs.e2e.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Récupération des rapports blob
        uses: actions/download-artifact@v6
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true

      - name: Récupération des résultats Allure
        uses: actions/download-artifact@v6
        with:
          pattern: allure-results-*
          path: allure-results
          merge-multiple: true

      - name: Fusion → rapport HTML Playwright
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: results.json
        run: npx playwright merge-reports --reporter=html,json ./all-blob-reports

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Génération du rapport Allure
        run: npx --yes allure-commandline@2 generate allure-results --clean -o allure-report

      - name: Résumé du run
        run: |
          read -r passed failed flaky skipped duration < <(jq -r '.stats | "\(.expected) \(.unexpected) \(.flaky) \(.skipped) \(.duration/1000|floor)"' results.json)
          {
            echo "## Résultats des tests E2E"
            echo ""
            echo "| ✅ Réussis | ❌ Échoués | ⚠️ Instables | ⏭️ Ignorés | ⏱️ Durée |"
            echo "|---|---|---|---|---|"
            echo "| $passed | $failed | $flaky | $skipped | ${duration}s |"
            echo ""
            echo "Rapports téléchargeables dans les artefacts \`playwright-report\` et \`allure-report\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Artefact — rapport Playwright
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Artefact — rapport Allure
        uses: actions/upload-artifact@v5
        with:
          name: allure-report
          path: allure-report/
          retention-days: 30

      - name: Préparation du site GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          mkdir -p site
          cp -r playwright-report site/playwright
          cp -r allure-report site/allure
          cat > site/index.html <<EOF
          <!DOCTYPE html>
          <html lang="fr"><head><meta charset="utf-8"><title>Mymini-Project — Rapports de tests</title>
          <style>body{font-family:system-ui,sans-serif;max-width:640px;margin:4rem auto;padding:0 1rem}a{display:block;margin:.6rem 0;font-size:1.1rem}</style>
          </head><body>
          <h1>Mymini-Project — Rapports de tests</h1>
          <p>Dernier run : ${{ github.event_name }} sur <code>${GITHUB_SHA::7}</code> — $(date -u '+%d/%m/%Y %H:%M UTC')</p>
          <a href="playwright/">📊 Rapport Playwright</a>
          <a href="allure/">📈 Rapport Allure</a>
          </body></html>
          EOF

      - name: Upload du site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  # ───────────────────────────── 5. Déploiement ─────────────────────────────
  deploy:
    name: Publication GitHub Pages
    needs: [report]
    if: ${{ !cancelled() && needs.report.result == 'success' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
